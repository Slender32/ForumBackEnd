<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2563eb">
<title>API 文档 · Forum</title>
<link rel="icon" type="image/svg+xml" href="./icon.svg">
<style>
:root{color-scheme:light;--blue:#2563eb;--ink:#172b4d;--muted:#64748b;--line:#e2e8f0;font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif;color:var(--ink);background:#f7f9fc}
*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:wait}[hidden]{display:none!important}
.topbar{height:80px;border-bottom:1px solid var(--line);background:white;display:flex;align-items:center;justify-content:space-between;padding:0 max(24px,calc((100vw - 1200px)/2));gap:20px}
.brand{display:flex;gap:12px;align-items:center}.logo{width:40px;height:40px;border-radius:10px;background:var(--blue);color:white;display:grid;place-items:center;font-size:26px;font-weight:750}.brand strong{font-size:16px}.brand small{display:block;margin-top:3px;font-size:11px;letter-spacing:1.6px;color:var(--muted)}
.badge{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}.dot{height:7px;width:7px;background:#94a3b8;border-radius:50%}.dot.active{background:var(--blue)}
main{max-width:1200px;margin:0 auto;padding:64px 24px 28px}.eyebrow{font-size:12px;letter-spacing:2px;color:var(--blue);font-weight:700;margin:0 0 20px}h1{font-size:42px;line-height:1.3;letter-spacing:-1px;margin:0 0 20px}p{line-height:1.8;color:var(--muted)}
.login-layout{display:grid;grid-template-columns:1fr 430px;gap:90px;align-items:center;min-height:530px}.intro{max-width:470px}.intro>p{font-size:16px;margin:0 0 36px}.features{display:grid;gap:24px}.feature{display:flex;gap:14px;align-items:center}.iconbox{width:40px;height:40px;flex-shrink:0;border-radius:10px;background:#eaf1ff;color:var(--blue);display:grid;place-items:center}.icon{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.feature strong{font-size:14px}.feature p{font-size:12px;margin:3px 0 0}
.card{background:white;border:1px solid var(--line);border-radius:16px;padding:36px}.card h2{margin:0 0 8px;font-size:24px}.card>p{font-size:13px;margin:0 0 30px}label{display:block;font-size:13px;font-weight:600;margin:20px 0 9px}.input-wrap{position:relative}.input-wrap>.icon{position:absolute;left:14px;top:15px;color:#94a3b8}
input{width:100%;height:50px;border:1px solid #cbd5e1;border-radius:8px;padding:0 14px 0 44px;outline:none;color:var(--ink);background:white}input:focus,select:focus{border-color:var(--blue);outline:3px solid #dbeafe}input::placeholder{color:#94a3b8}.primary,.secondary{min-height:44px;border-radius:8px;padding:10px 18px;display:inline-flex;align-items:center;justify-content:center;gap:9px;font-size:13px;font-weight:600}.primary{border:1px solid var(--blue);background:var(--blue);color:white}.primary:hover{background:#1d4ed8}.secondary{border:1px solid var(--line);color:#475569;background:white}.secondary:hover{background:#f1f5f9}button:focus-visible{outline:3px solid #93c5fd;outline-offset:3px}
#login-button{width:100%;margin-top:26px}.card>.form-note{font-size:12px;text-align:center;color:var(--muted);margin:20px 0 0;line-height:1.8}.error{color:#b42318;background:#fff3f1;border:1px solid #ffdad5;padding:12px 14px;border-radius:8px;font-size:13px;line-height:1.6;margin-top:18px}
.workspace-head{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:30px}.workspace-head h1{font-size:32px;margin-bottom:8px}.workspace-head p{margin:0;font-size:14px}.workspace-head .eyebrow{margin-bottom:12px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:16px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}.toolbar-group{display:flex;align-items:center;gap:12px}.toolbar label{margin:0;font-size:12px;color:var(--muted)}select{border:1px solid var(--line);border-radius:6px;background:white;padding:8px 28px 8px 12px;color:var(--ink)}.file-label{display:flex;align-items:center;gap:9px;font:13px Consolas,monospace;color:#475569}
.viewer{background:white;border:1px solid var(--line);border-radius:12px;overflow:hidden}pre{font:13px/1.8 Consolas,"SFMono-Regular",monospace;tab-size:2;margin:0;padding:24px;overflow:auto;height:60vh;min-height:320px;color:#334155;background:#fcfdff;white-space:pre}
footer{max-width:1152px;margin:30px auto 0;padding:24px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:16px;color:#94a3b8;font-size:12px}
@media(min-width:1500px){main{padding-top:100px}}@media(max-width:850px){main{padding-top:36px}.login-layout{grid-template-columns:1fr;gap:32px;min-height:0}.intro{max-width:none}h1{font-size:32px}.intro>p{margin-bottom:20px}.features{grid-template-columns:1fr 1fr;gap:16px}.card{max-width:530px;width:100%;justify-self:center}.workspace-head{align-items:flex-start}footer{margin-top:36px}}@media(max-width:480px){.topbar{height:70px;padding:0 20px}.badge{font-size:11px}main{padding:28px 20px 16px}.eyebrow{margin-bottom:12px}h1{font-size:28px}.features{grid-template-columns:1fr;gap:14px}.card{padding:26px 22px}.workspace-head{flex-direction:column}.toolbar{padding:14px}.toolbar-group{flex-wrap:wrap}pre{padding:16px;font-size:12px}footer{font-size:11px;flex-wrap:wrap}}
</style>
</head>
<body>
<svg aria-hidden="true" style="display:none" xmlns="http://www.w3.org/2000/svg"><symbol id="book" viewBox="0 0 24 24"><path d="M4 4h6a3 3 0 0 1 3 3v14a4 4 0 0 0-4-3H4zM13 7a3 3 0 0 1 3-3h4v14h-3a4 4 0 0 0-4 3"/></symbol><symbol id="lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/></symbol><symbol id="user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/></symbol><symbol id="arrow" viewBox="0 0 24 24"><path d="M5 12h14m-5-5 5 5-5 5"/></symbol><symbol id="download-icon" viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M4 16v4h16v-4"/></symbol><symbol id="code" viewBox="0 0 24 24"><path d="m8 6-6 6 6 6m8-12 6 6-6 6m-3-15-2 18"/></symbol></svg>
<header class="topbar"><div class="brand"><div class="logo" aria-label="A">A</div><div><strong>API 文档</strong><small>FORUM / DEVELOPERS</small></div></div><div class="badge"><span id="status-dot" class="dot"></span><span id="status">等待登录</span></div></header>
<main>
<section id="login-view" class="login-layout">
<div class="intro"><div class="eyebrow">DEVELOPER WORKSPACE</div><h1>从这里，<br>连接每一个接口。</h1><p>集中查看论坛接口定义，获取最新文档，<br>让开发与协作更简单。</p>
<div class="features"><div class="feature"><div class="iconbox"><svg class="icon"><use href="#book"/></svg></div><div><strong>实时接口文档</strong><p>与当前服务版本保持同步</p></div></div><div class="feature"><div class="iconbox"><svg class="icon"><use href="#code"/></svg></div><div><strong>两种标准格式</strong><p>查看或下载 JSON / YAML 文档</p></div></div></div></div>
<div class="card"><h2>登录文档工作台</h2><p>使用已获文档访问权限的账号继续。</p>
<form id="login-form">
<label for="email">账号（邮箱）</label><div class="input-wrap"><svg class="icon" aria-hidden="true"><use href="#user"/></svg><input id="email" name="email" type="email" autocomplete="username" placeholder="请输入账号邮箱" required maxlength="255"></div>
<label for="password">密码</label><div class="input-wrap"><svg class="icon" aria-hidden="true"><use href="#lock"/></svg><input id="password" name="password" type="password" autocomplete="current-password" placeholder="请输入登录密码" required></div>
<button class="primary" id="login-button" type="submit"><span>登录并查看文档</span><svg class="icon" aria-hidden="true"><use href="#arrow"/></svg></button>
<div id="login-error" class="error" role="alert" hidden></div></form><p class="form-note">仅授权账号可访问 · 登录状态仅在当前页面有效</p></div>
</section>
<section id="workspace" hidden>
<div class="workspace-head"><div><div class="eyebrow">API REFERENCE</div><h1>接口文档</h1><p id="summary">当前服务的接口定义</p></div><button class="secondary" id="signout" type="button">退出文档</button></div>
<div class="viewer"><div class="toolbar"><div class="file-label"><svg class="icon" aria-hidden="true"><use href="#code"/></svg><span id="filename">openapi.json</span></div><div class="toolbar-group"><label for="format">文档格式</label><select id="format"><option value="json">JSON</option><option value="yaml">YAML</option></select><button class="secondary" id="reload" type="button">刷新</button><button class="primary" id="download" type="button"><svg class="icon" aria-hidden="true"><use href="#download-icon"/></svg>下载文档</button></div></div><pre id="spec" tabindex="0" aria-label="接口文档内容"></pre></div><div id="document-error" class="error" role="alert" hidden></div>
</section>
<footer><span>Forum · 开发者文档中心</span><span>OpenAPI 标准 · 安全访问</span></footer>
</main>
<script>
'use strict';
const $ = id => document.getElementById(id);
const apiUrl = path => new URL('../' + path, window.location.href);
let accessToken = '';
let documentText = null;
let documentFormat = 'json';
let generation = 0;
function showError(id, message) { $(id).textContent = message; $(id).hidden = !message; }
function setBusy(busy) {
  $('login-button').disabled = busy;
  $('format').disabled = busy;
  $('reload').disabled = busy;
  $('download').disabled = busy || documentText === null;
}
function clearSession(message = '') {
  generation++;
  accessToken = '';
  documentText = null;
  $('password').value = '';
  $('spec').textContent = '';
  $('summary').textContent = '当前服务的接口定义';
  $('workspace').hidden = true;
  $('login-view').hidden = false;
  $('status').textContent = '等待登录';
  $('status-dot').classList.remove('active');
  showError('document-error', '');
  showError('login-error', message);
  setBusy(false);
}
async function responseError(response, login) {
  if (response.status === 429) return '操作过于频繁，请在 ' + (response.headers.get('Retry-After') || '稍后几') + ' 秒后重试。';
  if (!login && response.status === 403) return '此账号没有文档访问权限，请联系管理员授权。';
  if (!login && response.status === 401) return '登录已过期，请重新登录。';
  if (login && response.status === 400) return '账号或密码不正确，请检查后重试。';
  let message;
  try { message = (await response.json()).message; } catch (_) {}
  return message || '请求失败（HTTP ' + response.status + '），请稍后重试。';
}
async function loadDocument(current) {
  documentText = null;
  $('spec').textContent = '';
  showError('document-error', '');
  setBusy(true);
  const format = $('format').value;
  const response = await fetch(apiUrl('openapi/api-docs' + (format === 'yaml' ? '.yaml' : '')), {
    headers: { Authorization: 'Bearer ' + accessToken }, credentials: 'omit', cache: 'no-store'
  });
  if (!response.ok) {
    const message = await responseError(response, false);
    if (current !== generation) return;
    if (response.status === 401 || response.status === 403) { clearSession(message); return; }
    throw new Error(message);
  }
  const text = await response.text();
  if (current !== generation) return;
  documentText = text;
  documentFormat = format;
  if (format === 'json') {
    const doc = JSON.parse(text);
    documentText = JSON.stringify(doc, null, 2);
    $('summary').textContent = (doc.info?.title || '接口文档') + ' · ' + Object.keys(doc.paths || {}).length + ' 个接口路径 · OpenAPI ' + (doc.openapi || '');
  }
  $('filename').textContent = 'openapi.' + format;
  $('spec').textContent = documentText;
  $('login-view').hidden = true;
  $('workspace').hidden = false;
  $('status').textContent = '已授权访问';
  $('status-dot').classList.add('active');
}
$('login-form').addEventListener('submit', async event => {
  event.preventDefault();
  const email = $('email').value.trim();
  const password = $('password').value;
  clearSession();
  const current = generation;
  setBusy(true);
  $('login-button').querySelector('span').textContent = '正在验证…';
  try {
    const response = await fetch(apiUrl('auth/login'), {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({email, password}), credentials: 'omit', cache: 'no-store'
    });
    if (!response.ok) throw new Error(await responseError(response, true));
    const result = await response.json();
    if (current !== generation) return;
    if (result.code !== 0 || typeof result.data?.accessToken !== 'string' || !result.data.accessToken) throw new Error('登录响应异常，请重试。');
    accessToken = result.data.accessToken;
    await loadDocument(current);
  } catch (error) {
    if (current === generation) clearSession(error instanceof TypeError ? '无法连接服务器，请检查网络后重试。' : error.message);
  } finally {
    $('login-button').querySelector('span').textContent = '登录并查看文档';
    if (current === generation) setBusy(false);
  }
});
async function refreshDocument() {
  if (!accessToken) return;
  const current = ++generation;
  try { await loadDocument(current); }
  catch (error) { if (current === generation) showError('document-error', error instanceof TypeError ? '无法连接服务器，请稍后重试。' : error.message); }
  finally { if (current === generation) setBusy(false); }
}
$('format').onchange = refreshDocument;
$('reload').onclick = refreshDocument;
$('signout').onclick = () => { clearSession(); $('email').focus(); };
$('download').onclick = () => {
  if (documentText === null) return;
  const url = URL.createObjectURL(new Blob([documentText], {type: documentFormat === 'json' ? 'application/json' : 'application/yaml'}));
  const link = document.createElement('a');
  link.href = url;
  link.download = 'openapi.' + documentFormat;
  link.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
};
window.addEventListener('pagehide', () => clearSession());
</script>
</body>
</html>
